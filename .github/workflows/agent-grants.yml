# Daily run of the grants/contracts finder agent (SPEC_GRANTS.md §9), via
# agents-core's reusable workflow: it runs `uv run agents-run grants`, commits
# data/ (cost log, data/grants/ state + store) back to this branch, and
# force-pushes public-data/ to this repo's `data` branch (the data-branch
# contract), then notifies agents-hub if SITE_DISPATCH_TOKEN is set.
name: Agent - Grants

on:
  schedule:
    - cron: "0 13 * * *" # 06:00 PT
  workflow_dispatch:
    inputs:
      rescore_all:
        description: "Ignore the score cache and rescore every candidate"
        required: false
        type: boolean
        default: false
      lookback_days:
        description: "Override the SAM fetch window's lookback in days (backfills; watch the SAM budget)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  run:
    uses: Kghaffari26/agents-core/.github/workflows/run-agent.yml@v0.1.0
    with:
      agent: grants
      max_run_usd: "0.50"
      site_repo: Kghaffari26/agents-hub
      extra_args: >-
        ${{ inputs.rescore_all && '--rescore-all' || '' }}
        ${{ inputs.lookback_days != '' && format('--lookback-days={0}', inputs.lookback_days) || '' }}
      # Restored between runs with actions/cache: agents-core's HTTP cache and its
      # SAM daily request-budget file (.cache/http; data/grants/state.json keeps the
      # committed ledger too), and public-data/ so history/ accumulates up to 90
      # snapshots and manifest-entry.json keeps last_data_change_at across runs.
      cache_path: |
        .cache/http
        public-data
    secrets: inherit
