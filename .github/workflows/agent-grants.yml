# Daily run of the grants/contracts finder agent (SPEC_GRANTS.md §9), via
# agents-core's reusable workflow. run-agent.yml restores this repo's `data` branch
# into public-data/ (so history/ accumulates and last_data_change_at survives),
# runs `uv run agents-run grants`, commits data/ (cost log, guard failures, ops-alert
# state, data/grants/ state + store) back to this branch, force-pushes public-data/
# (latest.json, all.json, history/, manifest-entry.json, costs-summary.json,
# schema.json, trace.json, trace.schema.json) to the `data` branch, then notifies
# agents-hub if SITE_DISPATCH_TOKEN is set.
name: Agent - Grants

on:
  schedule:
    - cron: "0 13 * * *" # 06:00 PT
  workflow_dispatch:
    inputs:
      rescore_all:
        description: "Ignore the score cache and rescore every candidate"
        required: false
        type: boolean
        default: false
      lookback_days:
        description: "Override the SAM fetch window's lookback in days (backfills; watch the SAM budget)"
        required: false
        type: string
        default: ""
      alerts_dry_run:
        description: "Email alerts: write the digest to the job summary instead of sending it"
        required: false
        type: boolean
        default: false

# Nothing by default; the job below grants exactly what the agent needs.
permissions: {}

jobs:
  run:
    # run-agent.yml (agents-core >= v0.2.0) declares no permissions: it inherits
    # exactly this job's grant. contents: write commits data/ and pushes the `data`
    # branch; issues: write lets the agent open ops-alert issues (SAM key rejected or
    # expiring, SAM/Anthropic budget exhausted) via ctx.alert.
    permissions:
      contents: write
      issues: write
    uses: Kghaffari26/agents-core/.github/workflows/run-agent.yml@9e4f342a06b4e74bb27d73cf759e931033fa97bf
    with:
      agent: grants
      max_run_usd: "0.50"
      site_repo: Kghaffari26/agents-hub
      extra_args: >-
        ${{ inputs.rescore_all && '--rescore-all' || '' }}
        ${{ inputs.lookback_days != '' && format('--lookback-days={0}', inputs.lookback_days) || '' }}
      # agents-core's HTTP cache and its SAM daily request-budget file (.cache/http;
      # data/grants/state.json keeps the committed ledger too), and downloaded SAM
      # attachments with their extracted text (.cache/grants). public-data/ is no
      # longer cached: run-agent.yml restores it from the `data` branch.
      cache_path: |
        .cache/http
        .cache/grants
    secrets: inherit

  # Email digest of strong new matches to the owner (agents/grants/alerts.py), after a
  # successful run, on the store that run committed. Its own job because run-agent.yml
  # passes the agent step a fixed set of secrets (see STATUS.md). It never fails the
  # workflow: missing secrets or a delivery error are recorded in
  # data/grants/alerts.json, and the next run publishes a meta.warnings line.
  alerts:
    needs: run
    if: needs.run.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Commits data/grants/alerts.json (what was sent, so nothing repeats).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # includes the run's data/ commit

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync

      - name: Send the digest
        env:
          ALERT_EMAIL_API_KEY: ${{ secrets.ALERT_EMAIL_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          DRY_RUN: ${{ inputs.alerts_dry_run && '--dry-run' || '' }}
        run: |
          # shellcheck disable=SC2086 # DRY_RUN is empty or one flag
          uv run python -m agents.grants.alerts $DRY_RUN

      - name: Commit alert state
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "agents-core[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grants/alerts.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(grants): alerts $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "$BRANCH" && \
              git push origin "HEAD:$BRANCH" && break
            sleep $((2 ** i))
          done
