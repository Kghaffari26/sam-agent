[settings]
profile = "config/business_profile.toml"
sam_daily_request_budget = 8
max_sam_description_fetches = 3        # raise to ~50 with a 1,000/day key
max_grants_detail_fetches = 60
relevance_threshold = 25
max_llm_scoring_per_run = 150
batch_poll_timeout_min = 30
top_n_summaries = 20
store_max_items = 5000
all_json_max_rows = 2000
forecast_max_age_days = 180

[recommendation]
pursue = 75
consider = 55

[sam]
ptypes = ["o", "k", "p", "r"]
window_overlap_days = 1
first_run_lookback_days = 7

[grants_gov]
opp_statuses = "forecasted|posted"
rows_per_query = 100

# Bid research (SPEC_GRANTS.md §6.3): an agent loop per Pursue match that hasn't
# been researched at its current content hash, at most `max_per_run` per run.
[research]
enabled = true
max_per_run = 3
max_steps = 10
max_usd_per_opportunity = 0.12
max_attachments_per_opportunity = 3
max_sam_requests_per_run = 4           # attachment downloads, also counted in the SAM ledger
max_usaspending_calls_per_opportunity = 3

# SAM.gov personal API keys expire every 90 days. Set the current key's expiry
# date to get an ops-alert issue `alert_days_before` it lapses.
[sam_key]
# expires_on = 2026-12-20
alert_days_before = 14

# Email digest of strong new matches, to the owner only (agents/grants/alerts.py),
# sent by the `alerts` job in .github/workflows/agent-grants.yml after a successful
# run. The recipient and the Resend API key are repo secrets (ALERT_EMAIL_TO,
# ALERT_EMAIL_API_KEY), never this file. Set enabled = false to stop the emails.
[alerts]
enabled = true
min_fit = 80
recommendations = ["Pursue"]
max_per_day = 5
# Resend's test sender delivers only to the Resend account's own address; use an
# address on a domain verified in Resend to send from your own domain.
sender = "Grants Finder <onboarding@resend.dev>"
# The site's grants page; each entry links to <site_url>#<opportunity id>. Empty: no
# site link (the SAM.gov / Grants.gov link is always there).
site_url = ""
