# Business profile for Gulf Coast Mechanical, generated by tools/setup_contractor.py
# from the contractor intake. Matched trades: HVAC and plumbing.
# Every recommendation below is a starting point: edit freely.

id = "gulf-coast-mechanical"
name = "Gulf Coast Mechanical"
summary = "Commercial HVAC and plumbing contractor: installs and services chillers, boilers and rooftop units, and handles plumbing repairs for offices, clinics and schools. About 18 employees. Based in / performs in: FL, AL."
entity_type = "small_business"
certifications = ["SDVOSB"]
sam_registered = true
# Core NAICS for hvac and plumbing.
naics_primary = ["238220"]
# Related codes for the trades in your description.
naics_secondary = ["238990"]
# Product/service code families federal buyers use for this work.
psc_prefixes = ["Z2", "J0", "N0"]
# Your services plus the terms agencies use for this work.
keywords = ["HVAC repair", "chiller maintenance", "boiler service", "plumbing", "HVAC", "boiler", "chiller", "air conditioning", "mechanical"]
# Your 'avoid' list plus other trades' work, rejected by title before any AI cost.
negative_keywords = ["janitorial", "new construction", "software development", "nursing", "clinical services", "freight", "moving services", "warehousing", "brand name or equal", "supplies"]
clearance = "none"
# 1% to 150% of annual revenue: smaller isn't worth a proposal, larger is hard to staff and to show past performance for.
min_value = 32000
# 1% to 150% of annual revenue: smaller isn't worth a proposal, larger is hard to staff and to show past performance for.
max_value = 4800000
# On-site work: notices outside your states are filtered out.
remote_ok = false
states = ["FL", "AL"]
target_agencies = ["VETERANS AFFAIRS, DEPARTMENT OF"]
excluded_agencies = []
# Selective: only notices you can bid on now.
notice_types = ["solicitation", "combined_synopsis_solicitation"]
# Grants rarely fund this kind of firm; contracts only.
include_grants = false
grant_keywords = ["energy efficiency"]
# A mid-size team needs about a week to respond.
min_days_to_respond = 7
team_capacity_note = "Two service crews; can add a third for a 12-month contract."
past_performance = ["HVAC preventive maintenance for a county school district"]

# Filters (SPEC_GRANTS.md §5.2a): SAM.gov's search filters plus extras, applied
# before any AI cost. Empty / unset means no filter.
[filters]
# Selective: only your NAICS industry groups (4-digit).
naics = ["2382", "2389"]
psc = []
agencies = []
# Selective small business: only set-asides you qualify for, skipping full-and-open competitions against large primes.
set_asides = ["SBA", "SBP", "SDVOSBS"]
keywords_any = []
keywords_all = []
# posted_within_days = (not set)
# due_within_days = (not set)
# Sole-source and intent-to-award notices already have a chosen vendor.
exclude_sole_source = true
# Selective: negative keywords also checked against the description.
negative_keywords_in_description = true
require_deadline = false
require_known_value = false

# Scoring (SPEC_GRANTS.md §5.4a): weights sum to 100; changing them needs no rescore.
[scoring]
# eligibility +3 (from strategic): your certifications open set-aside competitions with fewer bidders; strategic +3 (from capability): you named target agencies, so agency fit matters more
weights = { capability = 37, eligibility = 23, size = 15, timeline = 15, strategic = 10 }
# Selective: Pursue only at fit 80+, Consider at 60+.
pursue = 80
consider = 60
# +5 fit when a notice is set aside for a status you hold (fewer bidders).
set_aside_bonus = 5
