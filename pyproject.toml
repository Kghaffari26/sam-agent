[project]
name = "sam-agent"
version = "0.1.0"
description = "Daily agents that screen SAM.gov / Grants.gov opportunities and other data sources, and publish ranked results to a website."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
