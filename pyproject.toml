[project]
name = "sam-agent"
version = "0.1.0"
description = "Daily agents that screen SAM.gov / Grants.gov opportunities and other data sources, and publish ranked results to a website."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agents-core",
    "pydantic>=2.6",
    "rapidfuzz>=3.9",
]

[project.entry-points."agents_core.agents"]
grants = "agents.grants.agent:AGENT"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv.sources]
agents-core = { git = "https://github.com/Kghaffari26/agents-core", tag = "v0.1.0" }
